# Python dependencies only: install the native AlTar/Pyre framework separately.
name: slipkit-altar
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.4.2
  - scipy=1.17.0
  - h5py=3.12.1
  - pip
  - pip:
      - cutde==25.7.24
      - meshio>=5
      - pandas>=2
      - matplotlib>=3.7
      - pytest>=8
      - -e .[bayesian]
